name: tradingapp
description: "A professional Indian stock trading simulator — Watchlist, Live Prices, Buy/Sell, Holdings."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0

  # State Management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.2.7

  # Persistence
  drift: 2.19.0
  sqlite3_flutter_libs: ^0.5.26
  path_provider: ^2.1.4
  path: ^1.9.0

  # Decimal / Money
  decimal: ^3.0.2
  intl: ^0.20.0

  # Utilities
  uuid: ^4.4.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: 2.19.0
  build_runner: 2.4.9

flutter:
  uses-material-design: true
